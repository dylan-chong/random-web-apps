<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meditation Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokyo-night-moon.css">
  <style>
    body { padding: 0; }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding-bottom: 100px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--bg-highlight);
      border-radius: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: var(--bg-highlight);
      border-color: var(--accent);
    }

    header { text-align: center; margin-bottom: 1.5rem; }

    h1 {
      font-family: 'Inter', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 2px 2px 4px var(--shadow), 0 0 30px rgba(130, 170, 255, 0.3);
      letter-spacing: 0.05em;
    }

    .subtitle {
      color: var(--fg-dim);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 0.3rem;
    }

    .timer-card {
      background: var(--bg-surface);
      border: 1px solid var(--bg-highlight);
      border-radius: 12px;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .timer-card.firing {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(130, 170, 255, 0.3);
    }

    .timer-card.completed {
      opacity: 0.6;
    }

    .timer-card.disabled {
      opacity: 0.4;
    }

    .timer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .timer-label {
      font-weight: 600;
      color: var(--fg);
      font-size: 0.95rem;
    }

    .timer-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .timer-fields {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 0.5rem;
    }

    .field-group input[type="range"] {
      cursor: pointer;
      height: 4px;
      border-radius: 2px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .field-group label {
      font-size: 0.7rem;
      color: var(--fg-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field-group input,
    .field-group select {
      background: var(--bg);
      border: 1px solid var(--bg-highlight);
      border-radius: 6px;
      padding: 0.3rem 0.4rem;
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      width: 100%;
      box-sizing: border-box;
    }

    .duration-input {
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .duration-input input {
      min-width: 0;
      text-align: center;
    }

    .duration-input__separator {
      color: var(--fg-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }

    .field-group input:focus,
    .field-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .sound-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    .sound-row .field-group {
      flex: 1;
    }

    .btn-icon {
      background: var(--bg-highlight);
      border: 1px solid var(--bg-highlight);
      border-radius: 6px;
      color: var(--fg-dim);
      cursor: pointer;
      padding: 0.45rem 0.55rem;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background: var(--bg-surface);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-icon.danger:hover {
      border-color: var(--negative);
      color: var(--negative);
    }

    .btn-test {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.4rem;
      background: var(--bg-highlight);
      border: 1px solid var(--bg-highlight);
      border-radius: 6px;
      color: var(--fg-dim);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-test:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-test:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-add {
      width: 100%;
      padding: 0.8rem;
      background: var(--bg-surface);
      border: 2px dashed var(--bg-highlight);
      border-radius: 12px;
      color: var(--fg-dim);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 1.5rem;
    }

    .btn-add:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--bg-highlight);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .controls-row {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .btn-control {
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--bg-highlight);
      background: var(--bg-highlight);
      color: var(--fg);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      border-color: var(--accent);
    }

    .btn-control.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    .btn-control.primary:hover {
      opacity: 0.9;
    }

    .btn-control:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--fg-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-text .highlight {
      color: var(--accent);
    }

    .timer-progress {
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: var(--fg-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .timer-progress .next-fire {
      color: var(--accent);
    }

    .completed-badge {
      color: var(--positive);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--bg-highlight);
      border-radius: 20px;
      transition: background 0.2s ease;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      bottom: 3px;
      background: var(--fg-dim);
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--accent);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(16px);
      background: var(--bg);
    }

    @media (max-width: 480px) {
      .timer-fields {
        grid-template-columns: 1fr 1fr;
      }
    }

    .youtube-player-container {
      width: 100%;
      max-width: 560px;
      margin: 1.5rem auto;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--bg-highlight);
      background: var(--bg-surface);
    }

    .youtube-player-container iframe {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useRef, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    const html = htm.bind(h);

    const STORAGE_KEY = 'meditation_settings';

    // Constants
    const DEFAULT_YOUTUBE_URL = 'https://www.youtube.com/watch?v=MK3lB-uY0gE';
    const DEFAULT_BACKGROUND_VOLUME = 0.3;     // 30%
    const DEFAULT_BOOST_VOLUME = 1.0;          // 100% (per-timer)
    const DEFAULT_BOOST_DURATION_SECONDS = 4.0; // (per-timer)
    const MIN_BOOST_DURATION_SECONDS = 2.0;
    const MAX_BOOST_DURATION_SECONDS = 10.0;
    const VOLUME_TRANSITION_DURATION_MS = 1000; // 1 second smooth crossfade
    const TICK_INTERVAL_MS = 100;

    // Convert YouTube URL to embeddable format
    function getYouTubeVideoId(url) {
      const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/);
      return match ? match[1] : null;
    }

    // Loads the YouTube IFrame Player API script once and resolves when ready.
    let youtubeApiPromise = null;
    function loadYouTubeApi() {
      if (youtubeApiPromise) return youtubeApiPromise;
      youtubeApiPromise = new Promise((resolve) => {
        if (window.YT && window.YT.Player) {
          resolve(window.YT);
          return;
        }
        const previousCallback = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => {
          if (previousCallback) previousCallback();
          resolve(window.YT);
        };
        const script = document.createElement('script');
        script.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(script);
      });
      return youtubeApiPromise;
    }


    function createDefaultTimer(intervalSeconds = 300, repeatCount = 3, boostDuration = DEFAULT_BOOST_DURATION_SECONDS) {
      return {
        id: crypto.randomUUID(),
        intervalSeconds,
        repeatCount,
        boostVolume: DEFAULT_BOOST_VOLUME,
        boostDuration,
        enabled: true,
      };
    }

    function createDefaultTimers() {
      return [
        createDefaultTimer(60, 60),
        createDefaultTimer(300, 10, 10.0),
      ];
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (data.timers && data.timers.length > 0) {
            // Fill in missing per-timer fields for old timers
            const timers = data.timers.map(t => ({
              ...t,
              boostVolume: t.boostVolume != null ? t.boostVolume : DEFAULT_BOOST_VOLUME,
              boostDuration: t.boostDuration != null ? t.boostDuration : DEFAULT_BOOST_DURATION_SECONDS,
            }));
            return {
              timers,
              youtubeURL: data.youtubeURL || DEFAULT_YOUTUBE_URL,
              backgroundVolume: data.backgroundVolume != null ? data.backgroundVolume : DEFAULT_BACKGROUND_VOLUME,
            };
          }
        }
      } catch (e) {}
      return {
        timers: createDefaultTimers(),
        youtubeURL: DEFAULT_YOUTUBE_URL,
        backgroundVolume: DEFAULT_BACKGROUND_VOLUME,
      };
    }

    function saveSettings(timers, youtubeURL, backgroundVolume) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        timers,
        youtubeURL,
        backgroundVolume,
      }));
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    let wakeLock = null;

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (e) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function TimerCard({ timer, index, onUpdate, onDelete, running, timerState, onTest, testing }) {
      const update = (field, value) => onUpdate(timer.id, { ...timer, [field]: value });
      const isCompleted = timerState && timerState.fireCount >= timer.repeatCount;
      const isFiring = timerState && timerState.firing;

      let cardClass = 'timer-card';
      if (isFiring) cardClass += ' firing';
      if (isCompleted && running) cardClass += ' completed';
      if (!timer.enabled) cardClass += ' disabled';

      return html`
        <div class=${cardClass}>
          <div class="timer-header">
            <span class="timer-label">Timer ${index + 1}</span>
            <div class="timer-actions">
              <label class="toggle-switch">
                <input type="checkbox" checked=${timer.enabled}
                  onChange=${(e) => update('enabled', e.target.checked)}
                  disabled=${running} />
                <span class="toggle-slider"></span>
              </label>
              <button class="btn-icon danger" onClick=${() => onDelete(timer.id)}
                disabled=${running} title="Delete timer">
                ✕
              </button>
            </div>
          </div>

          <div class="timer-fields">
            <div class="field-group">
              <label>Interval (min:sec)</label>
              <div class="duration-input">
                <input type="number" min="0" step="1" class="duration-input__minutes"
                  value=${Math.floor((timer.intervalSeconds || 0) / 60)}
                  onInput=${(e) => {
                    const minutes = e.target.value === '' ? 0 : parseInt(e.target.value) || 0;
                    const seconds = (timer.intervalSeconds || 0) % 60;
                    update('intervalSeconds', minutes * 60 + seconds);
                  }}
                  disabled=${running} />
                <span class="duration-input__separator">:</span>
                <input type="number" min="0" max="59" step="1" class="duration-input__seconds"
                  value=${String((timer.intervalSeconds || 0) % 60).padStart(2, '0')}
                  onInput=${(e) => {
                    const rawSeconds = e.target.value === '' ? 0 : parseInt(e.target.value) || 0;
                    const seconds = Math.min(59, Math.max(0, rawSeconds));
                    const minutes = Math.floor((timer.intervalSeconds || 0) / 60);
                    update('intervalSeconds', minutes * 60 + seconds);
                  }}
                  disabled=${running} />
              </div>
            </div>
            <div class="field-group">
              <label>Repeat</label>
              <input type="number" min="1" step="1"
                value=${timer.repeatCount}
                onInput=${(e) => update('repeatCount', e.target.value === '' ? '' : parseInt(e.target.value) || '')}
                disabled=${running} />
            </div>
            <div class="field-group">
              <label>Boost (${Math.round(timer.boostVolume * 100)}%)</label>
              <input type="range" min="30" max="100" step="1"
                value=${Math.round(timer.boostVolume * 100)}
                onInput=${(e) => update('boostVolume', parseInt(e.target.value) / 100)}
                disabled=${running} />
            </div>
            <div class="field-group">
              <label>Duration (${timer.boostDuration.toFixed(1)}s)</label>
              <input type="range" min=${MIN_BOOST_DURATION_SECONDS} max=${MAX_BOOST_DURATION_SECONDS} step="0.5"
                value=${timer.boostDuration}
                onInput=${(e) => update('boostDuration', parseFloat(e.target.value))}
                disabled=${running} />
            </div>
          </div>

          ${!running && html`
            <button class="btn-test" onClick=${() => onTest(timer)} disabled=${testing}>
              ${testing ? 'Testing…' : 'Test'}
            </button>
          `}

          ${running && timer.enabled && html`
            <div class="timer-progress">
              ${isCompleted
                ? html`<span class="completed-badge">✓ Completed</span>`
                : html`
                  <span>Fired: ${timerState ? timerState.fireCount : 0}/${timer.repeatCount}</span>
                  ${timerState && timerState.secondsUntilNext != null && html`
                    ${' '}<span class="next-fire">Next in ${formatTime(timerState.secondsUntilNext)}</span>
                  `}
                `
              }
            </div>
          `}
        </div>
      `;
    }

    function App() {
      const settings = loadSettings();
      const [timers, setTimers] = useState(() => settings.timers);
      const [running, setRunning] = useState(false);
      const [paused, setPaused] = useState(false);
      const [timerStates, setTimerStates] = useState({});
      const [elapsed, setElapsed] = useState(0);
      const [youtubeURL, setYoutubeURL] = useState(settings.youtubeURL);
      const [backgroundVolume, setBackgroundVolume] = useState(settings.backgroundVolume);
      const [testingTimerId, setTestingTimerId] = useState(null);

      const sessionRef = useRef(null);
      const tickRef = useRef(null);
      const playerRef = useRef(null);
      const playerContainerRef = useRef(null);
      const volumeStateRef = useRef({
        currentVolume: settings.backgroundVolume,
        targetVolume: settings.backgroundVolume,
        volumeBoostEndTime: null,
        transitionStartTime: null,
      });

      useEffect(() => {
        saveSettings(timers, youtubeURL, backgroundVolume);
      }, [timers, youtubeURL, backgroundVolume]);

      // (Re)creates the YouTube player whenever the video changes.
      useEffect(() => {
        const videoId = getYouTubeVideoId(youtubeURL);
        if (!videoId || !playerContainerRef.current) return;

        let cancelled = false;
        playerContainerRef.current.innerHTML = '';
        const mountNode = document.createElement('div');
        playerContainerRef.current.appendChild(mountNode);

        loadYouTubeApi().then((YT) => {
          if (cancelled) return;
          playerRef.current = new YT.Player(mountNode, {
            width: '100%',
            height: '315',
            videoId,
            playerVars: {
              loop: 1,
              playlist: videoId,
              autoplay: 0,
            },
            events: {
              onReady: (e) => e.target.setVolume(Math.round(backgroundVolume * 100)),
            },
          });
        });

        return () => {
          cancelled = true;
          if (playerRef.current && playerRef.current.destroy) {
            playerRef.current.destroy();
          }
          playerRef.current = null;
        };
      }, [youtubeURL]);


      useEffect(() => {
        const onVisChange = () => {
          if (document.visibilityState === 'visible' && running && !paused) {
            requestWakeLock();
          }
        };
        document.addEventListener('visibilitychange', onVisChange);
        return () => document.removeEventListener('visibilitychange', onVisChange);
      }, [running, paused]);

      const updateTimer = useCallback((id, updated) => {
        setTimers(ts => ts.map(t => t.id === id ? updated : t));
      }, []);

      const deleteTimer = useCallback((id) => {
        setTimers(ts => ts.length > 1 ? ts.filter(t => t.id !== id) : ts);
      }, []);

      const addTimer = useCallback(() => {
        setTimers(ts => [...ts, createDefaultTimer()]);
      }, []);

      const triggerVolumeBoost = useCallback((boostVol, boostDur) => {
        const now = Date.now();
        const volState = volumeStateRef.current;

        if (now >= (volState.volumeBoostEndTime || 0)) {
          volState.volumeBoostEndTime = now + (boostDur * 1000);
        } else {
          // Timer already boosting; update end time if this timer's duration is longer
          const currentEndOffset = volState.volumeBoostEndTime - now;
          const newEndOffset = boostDur * 1000;
          if (newEndOffset > currentEndOffset) {
            volState.volumeBoostEndTime = now + newEndOffset;
          }
        }
        // Use max of current target and new boost volume
        volState.targetVolume = Math.max(volState.targetVolume, boostVol);
        volState.transitionStartTime = now;
      }, []);

      const updateVolume = useCallback((now) => {
        const volState = volumeStateRef.current;

        const shouldBeBoosted = now < (volState.volumeBoostEndTime || 0);
        if (!shouldBeBoosted) {
          volState.targetVolume = backgroundVolume;
        }

        if (volState.transitionStartTime === null) {
          volState.transitionStartTime = now;
        }

        const elapsedInTransition = now - volState.transitionStartTime;

        if (elapsedInTransition >= VOLUME_TRANSITION_DURATION_MS) {
          volState.currentVolume = volState.targetVolume;
          volState.transitionStartTime = null;
        } else {
          const progress = elapsedInTransition / VOLUME_TRANSITION_DURATION_MS;
          const previousVolume = volState.currentVolume;
          volState.currentVolume = previousVolume + (volState.targetVolume - previousVolume) * progress;
        }

        if (playerRef.current && playerRef.current.setVolume) {
          playerRef.current.setVolume(Math.round(volState.currentVolume * 100));
        }
      }, [backgroundVolume]);

      const testTimer = useCallback((timer) => {
        if (testingTimerId || !playerRef.current || !playerRef.current.playVideo) return;

        setTestingTimerId(timer.id);

        const player = playerRef.current;
        const rampVolume = (fromVol, toVol, durationMs, onDone) => {
          const rampStart = Date.now();
          const rampTick = setInterval(() => {
            const progress = Math.min(1, (Date.now() - rampStart) / durationMs);
            player.setVolume(Math.round((fromVol + (toVol - fromVol) * progress) * 100));
            if (progress >= 1) {
              clearInterval(rampTick);
              onDone && onDone();
            }
          }, TICK_INTERVAL_MS);
        };

        player.setVolume(Math.round(backgroundVolume * 100));
        player.playVideo();

        setTimeout(() => {
          rampVolume(backgroundVolume, timer.boostVolume, VOLUME_TRANSITION_DURATION_MS, () => {
            setTimeout(() => {
              rampVolume(timer.boostVolume, backgroundVolume, VOLUME_TRANSITION_DURATION_MS, () => {
                setTimeout(() => {
                  if (player.pauseVideo) player.pauseVideo();
                  setTestingTimerId(null);
                }, 1000);
              });
            }, 1000);
          });
        }, 1000);
      }, [backgroundVolume, testingTimerId]);

      const startSession = useCallback(() => {
        const validated = timers.map(t => ({
          ...t,
          intervalSeconds: Math.max(1, parseInt(t.intervalSeconds) || 1),
          repeatCount: Math.max(1, parseInt(t.repeatCount) || 1),
        }));
        setTimers(validated);

        const enabledTimers = validated.filter(t => t.enabled);
        if (enabledTimers.length === 0) return;

        const now = Date.now();
        const states = {};
        for (const t of enabledTimers) {
          states[t.id] = {
            fireCount: 0,
            nextFireAt: now + t.intervalSeconds * 1000,
            firing: false,
            secondsUntilNext: t.intervalSeconds,
          };
        }

        volumeStateRef.current = {
          currentVolume: backgroundVolume,
          targetVolume: backgroundVolume,
          volumeBoostEndTime: null,
          transitionStartTime: null,
        };

        sessionRef.current = { startTime: now, pausedElapsed: 0 };
        setTimerStates(states);
        setElapsed(0);
        setRunning(true);
        setPaused(false);
        requestWakeLock();

        if (playerRef.current && playerRef.current.playVideo) {
          playerRef.current.playVideo();
        }

        tickRef.current = setInterval(() => {
          const session = sessionRef.current;
          if (!session || session.isPaused) return;

          const currentTime = Date.now();
          const totalElapsed = (currentTime - session.startTime - session.pausedElapsed) / 1000;
          setElapsed(totalElapsed);

          updateVolume(currentTime);

          setTimerStates(prev => {
            const next = { ...prev };
            let allDone = true;
            let maxBoostVolume = 0;
            let maxBoostDuration = 0;
            let anyFiring = false;

            for (const t of enabledTimers) {
              const state = next[t.id];
              if (!state || state.fireCount >= t.repeatCount) continue;
              allDone = false;

              if (currentTime >= state.nextFireAt) {
                anyFiring = true;
                maxBoostVolume = Math.max(maxBoostVolume, t.boostVolume);
                maxBoostDuration = Math.max(maxBoostDuration, t.boostDuration);
                const newFireCount = state.fireCount + 1;
                next[t.id] = {
                  ...state,
                  fireCount: newFireCount,
                  nextFireAt: newFireCount < t.repeatCount
                    ? state.nextFireAt + t.intervalSeconds * 1000
                    : null,
                  firing: true,
                  secondsUntilNext: newFireCount < t.repeatCount ? t.intervalSeconds : null,
                };
                setTimeout(() => {
                  setTimerStates(p => ({
                    ...p,
                    [t.id]: { ...p[t.id], firing: false },
                  }));
                }, 500);
              } else {
                next[t.id] = {
                  ...state,
                  secondsUntilNext: Math.max(0, (state.nextFireAt - currentTime) / 1000),
                };
              }
            }

            if (anyFiring) {
              triggerVolumeBoost(maxBoostVolume, maxBoostDuration);
            }

            if (allDone) {
              const reallyDone = enabledTimers.every(t => next[t.id] && next[t.id].fireCount >= t.repeatCount);
              if (reallyDone) {
                setTimeout(() => {
                  clearInterval(tickRef.current);
                  if (playerRef.current && playerRef.current.pauseVideo) {
                    playerRef.current.pauseVideo();
                  }
                  setRunning(false);
                  setPaused(false);
                  releaseWakeLock();
                }, 0);
              }
            }

            return next;
          });
        }, TICK_INTERVAL_MS);
      }, [timers, youtubeURL, backgroundVolume, triggerVolumeBoost, updateVolume]);

      const pauseSession = useCallback(() => {
        if (!sessionRef.current) return;
        sessionRef.current.isPaused = true;
        sessionRef.current.pauseStart = Date.now();
        setPaused(true);
        if (playerRef.current && playerRef.current.pauseVideo) {
          playerRef.current.pauseVideo();
        }
      }, []);

      const resumeSession = useCallback(() => {
        if (!sessionRef.current) return;

        const pauseDuration = Date.now() - sessionRef.current.pauseStart;
        sessionRef.current.pausedElapsed += pauseDuration;

        setTimerStates(prev => {
          const next = {};
          for (const [id, state] of Object.entries(prev)) {
            next[id] = {
              ...state,
              nextFireAt: state.nextFireAt ? state.nextFireAt + pauseDuration : null,
            };
          }
          return next;
        });

        sessionRef.current.isPaused = false;
        setPaused(false);
        requestWakeLock();
        if (playerRef.current && playerRef.current.playVideo) {
          playerRef.current.playVideo();
        }
      }, [backgroundVolume]);

      const resetSession = useCallback(() => {
        clearInterval(tickRef.current);
        sessionRef.current = null;
        if (playerRef.current && playerRef.current.pauseVideo) {
          playerRef.current.pauseVideo();
        }
        setRunning(false);
        setPaused(false);
        setTimerStates({});
        setElapsed(0);
        releaseWakeLock();
      }, []);


      const enabledCount = timers.filter(t => t.enabled).length;

      let meditationTimeLeft = null;
      if (running) {
        const remaining = timers
          .filter(t => t.enabled)
          .map(t => {
            const state = timerStates[t.id];
            if (!state || state.secondsUntilNext == null) return 0;
            const remainingFiresAfterNext = t.repeatCount - state.fireCount - 1;
            return state.secondsUntilNext + remainingFiresAfterNext * t.intervalSeconds;
          });
        if (remaining.length > 0) meditationTimeLeft = Math.max(...remaining);
      }

      return html`
        <a href="../index.html" class="back-link">← Back to Apps</a>
        <header>
          <h1>Meditation Timer</h1>
          <p class="subtitle">Background audio with smart volume ducking</p>
        </header>

        ${!running && html`
          <div class="timer-card">
            <div class="field-group">
              <label>YouTube URL</label>
              <input type="text"
                value=${youtubeURL}
                onInput=${(e) => setYoutubeURL(e.target.value)}
                placeholder="https://www.youtube.com/watch?v=..."
                disabled=${running} />
            </div>

            <div class="timer-fields" style="margin-top: 0.8rem; grid-template-columns: 1fr;">
              <div class="field-group">
                <label>Background Volume (${Math.round(backgroundVolume * 100)}%)</label>
                <input type="range" min="0" max="80" step="1"
                  value=${Math.round(backgroundVolume * 100)}
                  onInput=${(e) => setBackgroundVolume(parseInt(e.target.value) / 100)}
                  disabled=${running} />
              </div>
            </div>
          </div>
        `}

        ${youtubeURL && getYouTubeVideoId(youtubeURL) && html`
          <div class="youtube-player-container" ref=${playerContainerRef}></div>
        `}

        ${timers.map((timer, i) => html`
          <${TimerCard}
            key=${timer.id}
            timer=${timer}
            index=${i}
            onUpdate=${updateTimer}
            onDelete=${deleteTimer}
            running=${running}
            timerState=${timerStates[timer.id]}
            onTest=${testTimer}
            testing=${testingTimerId !== null}
          />
        `)}

        ${!running && html`
          <button class="btn-add" onClick=${addTimer}>+ Add Timer</button>
        `}

        <div class="controls">
          <div class="status-text">
            ${running
              ? html`
                  <span>Elapsed: <span class="highlight">${formatTime(elapsed)}</span></span>
                  ${meditationTimeLeft != null && html`
                    ${' | Time left: '}<span class="highlight">${formatTime(meditationTimeLeft)}</span>
                  `}
                `
              : html`<span>${enabledCount} timer${enabledCount !== 1 ? 's' : ''} configured</span>`
            }
          </div>
          <div class="controls-row">
            ${!running && html`
              <button class="btn-control primary" onClick=${startSession}
                disabled=${enabledCount === 0}>
                Start
              </button>
            `}
            ${running && !paused && html`
              <button class="btn-control" onClick=${pauseSession}>Pause</button>
            `}
            ${running && paused && html`
              <button class="btn-control primary" onClick=${resumeSession}>Resume</button>
            `}
            ${running && html`
              <button class="btn-control" onClick=${resetSession}>Reset</button>
            `}
          </div>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
