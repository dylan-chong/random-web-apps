<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Poker Ledger</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokyo-night-moon.css">
  <style>
    body { padding: 0; }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--bg-highlight);
      border-radius: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: var(--bg-highlight);
      border-color: var(--accent);
    }

    header { text-align: center; margin-bottom: 1.5rem; }

    h1 {
      font-family: 'Inter', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 2px 2px 4px var(--shadow), 0 0 30px rgba(130, 170, 255, 0.3);
      letter-spacing: 0.05em;
    }

    .subtitle {
      color: var(--fg-dim);
      font-size: 0.8rem;
      margin-top: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      background: var(--bg-surface);
      border: 2px solid var(--bg-highlight);
      border-radius: 8px 8px 0 0;
      color: var(--fg-dim);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tab-btn:hover {
      background: var(--bg-highlight);
      border-color: var(--accent);
      color: var(--fg);
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      box-shadow: 0 4px 20px rgba(130, 170, 255, 0.3);
    }

    .tab-content {
      background: rgba(34, 36, 54, 0.8);
      border: 2px solid var(--bg-highlight);
      border-radius: 0 0 12px 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--accent-light);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 0.875rem;
      background: var(--bg);
      border: 2px solid var(--bg-highlight);
      border-radius: 8px;
      color: var(--fg);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      -webkit-appearance: none;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(130, 170, 255, 0.15);
    }

    input::placeholder { color: var(--comment); }

    .autocomplete-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .autocomplete-btn {
      padding: 0.4rem 0.75rem;
      background: var(--bg-highlight);
      border: 1px solid var(--secondary);
      border-radius: 20px;
      color: var(--secondary);
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 32px;
    }

    .autocomplete-btn:active {
      background: var(--secondary);
      color: var(--bg);
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
    }

    .type-selector-btn {
      padding: 0.75rem 0.5rem;
      background: var(--bg);
      border: 2px solid var(--bg-highlight);
      border-radius: 8px;
      color: var(--fg-dim);
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-height: 44px;
    }

    .type-selector-btn:active,
    .type-selector-btn.active {
      border-color: var(--accent);
      background: rgba(130, 170, 255, 0.1);
      color: var(--accent);
      font-weight: 600;
    }

    .btn-primary {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
      border: none;
      border-radius: 8px;
      color: var(--bg);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      min-height: 48px;
      box-shadow: 0 4px 15px rgba(130, 170, 255, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .summary-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .summary-card {
      background: var(--bg);
      border: 1px solid var(--bg-highlight);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }

    .summary-card-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--fg-dim);
      margin-bottom: 0.25rem;
    }

    .summary-card-value {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent);
    }

    .summary-card-subtitle {
      font-size: 0.6rem;
      color: var(--fg-dim);
      margin-top: 0.2rem;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 0.75rem;
      -webkit-overflow-scrolling: touch;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      background: var(--bg-highlight);
      padding: 0.6rem 0.5rem;
      text-align: left;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-light);
      border-bottom: 2px solid var(--accent);
      white-space: nowrap;
    }

    td {
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid var(--bg-highlight);
      font-size: 0.85rem;
    }

    .type-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .type-buy-in-cash { background: rgba(158, 206, 106, 0.15); color: var(--positive); }
    .type-buy-in-iou { background: rgba(224, 175, 104, 0.15); color: #e0af68; }
    .type-cash-out-cash { background: rgba(130, 170, 255, 0.15); color: var(--accent); }
    .type-cash-out-iou { background: rgba(192, 153, 255, 0.15); color: var(--secondary); }
    .type-edit { background: rgba(128, 128, 128, 0.15); color: var(--fg-dim); }

    .positive { color: var(--positive); font-weight: 600; }
    .negative { color: var(--negative); font-weight: 600; }
    .neutral { color: var(--fg-dim); }

    .event-item {
      padding: 0.75rem;
      border-bottom: 1px solid var(--bg-highlight);
      position: relative;
    }

    .event-main {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .event-player {
      font-weight: 500;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-amount {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
      margin-top: 0.3rem;
      font-size: 0.7rem;
      color: var(--fg-dim);
    }

    .event-notes {
      font-style: italic;
      flex: 1;
      word-break: break-word;
    }

    .event-edit-row {
      padding: 0.4rem 0.75rem 0.4rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--fg-dim);
      opacity: 0.7;
    }

    .event-edit-change {
      flex: 1;
      word-break: break-word;
    }

    .dots-btn {
      background: none;
      border: none;
      color: var(--fg-dim);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      min-width: 32px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .dots-btn:active {
      background: var(--bg-highlight);
    }

    .popover {
      position: absolute;
      right: 0.75rem;
      top: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--bg-highlight);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 100;
      overflow: hidden;
      min-width: 120px;
    }

    .popover-item {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      background: none;
      border: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
    }

    .popover-item:active {
      background: var(--bg-highlight);
    }

    .popover-item.danger {
      color: var(--danger);
    }

    .popover-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 99;
    }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-surface);
      z-index: 200;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .modal {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .modal h3 {
      margin: 0 0 1.25rem;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .modal-actions button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
    }

    .modal-btn-save {
      background: var(--teal);
      color: var(--bg);
    }

    .modal-btn-cancel {
      background: var(--bg-highlight);
      color: var(--fg);
    }

    .edit-input {
      padding: 0.4rem 0.5rem;
      background: var(--bg);
      border: 1px solid var(--bg-highlight);
      border-radius: 4px;
      color: var(--fg);
      font-family: inherit;
      font-size: 0.85rem;
    }

    .edit-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--comment);
    }

    .empty-state-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

    .delete-all-btn {
      margin-top: 1.5rem;
      padding: 0.6rem 1rem;
      background: transparent;
      border: 1px solid var(--danger);
      border-radius: 6px;
      color: var(--danger);
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      min-height: 36px;
    }

    .delete-all-btn:active {
      background: var(--danger);
      color: var(--fg);
    }

    .breakdown {
      font-size: 0.7rem;
      color: var(--fg-dim);
      display: block;
      margin-top: 0.15rem;
    }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script type="module">
    import { h, render, Fragment } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useMemo } from 'https://esm.sh/preact@10.19.3/hooks';
    import { createPortal } from 'https://esm.sh/preact@10.19.3/compat';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    const STORAGE_KEYS = {
      SESSIONS: 'ledger_sessions',
      ACTIVE_SESSION: 'ledger_active_session',
      USERNAMES: 'ledger_usernames',
      AMOUNTS_IN: 'ledger_amounts_in',
      AMOUNTS_OUT: 'ledger_amounts_out',
      IOU_PAID: 'ledger_iou_paid'
    };

    const EVENT_TYPES = {
      'buy-in-cash': 'Cash in',
      'buy-in-iou': 'IOHost',
      'cash-out-cash': 'Cash out',
      'cash-out-iou': 'IOPlayer',
      'edit': 'Edit'
    };

    const AMOUNT_KEY_MAP = {
      'buy-in-cash': STORAGE_KEYS.AMOUNTS_IN,
      'buy-in-iou': STORAGE_KEYS.AMOUNTS_IN,
      'cash-out-cash': STORAGE_KEYS.AMOUNTS_OUT,
      'cash-out-iou': STORAGE_KEYS.AMOUNTS_OUT
    };

    function getData(key) {
      const data = localStorage.getItem(key);
      if (!data) {
        if (key === STORAGE_KEYS.SESSIONS) return [];
        return {};
      }
      return JSON.parse(data);
    }

    function getSessions() {
      let sessions = getData(STORAGE_KEYS.SESSIONS);
      if (!Array.isArray(sessions) || sessions.length === 0) {
        const legacyEvents = localStorage.getItem('ledger_events');
        const events = legacyEvents ? JSON.parse(legacyEvents) : [];
        sessions = [{ id: Date.now(), events }];
        setData(STORAGE_KEYS.SESSIONS, sessions);
        setData(STORAGE_KEYS.ACTIVE_SESSION, sessions[0].id);
      }
      return sessions;
    }

    function getActiveSessionId() {
      const id = localStorage.getItem(STORAGE_KEYS.ACTIVE_SESSION);
      if (id) return JSON.parse(id);
      const sessions = getSessions();
      return sessions[0].id;
    }

    function setData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    function formatCurrency(amount) {
      const num = parseFloat(amount);
      return '$' + (num % 1 === 0 ? num.toFixed(0) : num.toFixed(2));
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function getTopItems(obj, limit = 8) {
      return Object.entries(obj)
        .sort((a, b) => b[1] - a[1])
        .slice(0, limit)
        .map(([key]) => key);
    }

    // --- Components ---

    function TabBar({ activeTab, setActiveTab }) {
      const tabs = [
        { id: 'list', label: 'Events' },
        { id: 'results', label: 'Results' },
        { id: 'sessions', label: 'Sessions' }
      ];
      return html`
        <div class="tabs">
          ${tabs.map(t => html`
            <button class="tab-btn ${activeTab === t.id ? 'active' : ''}"
              onClick=${() => setActiveTab(t.id)}>${t.label}</button>
          `)}
        </div>
      `;
    }

    function Portal({ children }) {
      return createPortal(children, document.body);
    }

    function AutocompleteChips({ items, onSelect }) {
      if (!items.length) return null;
      return html`
        <div class="autocomplete-btns">
          ${items.map(item => html`
            <button type="button" class="autocomplete-btn"
              onClick=${() => onSelect(item)}>${item}</button>
          `)}
        </div>
      `;
    }

    function AddEventModal({ events, setEvents, onClose }) {
      const [username, setUsername] = useState('');
      const [eventType, setEventType] = useState('buy-in-cash');
      const [amount, setAmount] = useState('');
      const [notes, setNotes] = useState('');

      const usernames = getData(STORAGE_KEYS.USERNAMES);
      const amounts = getData(AMOUNT_KEY_MAP[eventType]);
      const topUsernames = getTopItems(usernames);
      const topAmounts = getTopItems(amounts).map(a => formatCurrency(a));

      function handleSubmit(e) {
        e.preventDefault();
        const amt = parseFloat(amount);
        if (!username.trim() || isNaN(amt) || amt <= 0) return;

        const newEvent = {
          id: Date.now(),
          username: username.trim(),
          type: eventType,
          amount: amt,
          notes: notes.trim(),
          timestamp: Date.now()
        };

        const updated = [...events, newEvent];
        setEvents(updated);
        setData(STORAGE_KEYS.EVENTS, updated);

        const un = getData(STORAGE_KEYS.USERNAMES);
        un[username.trim()] = (un[username.trim()] || 0) + 1;
        setData(STORAGE_KEYS.USERNAMES, un);

        const amtKey = AMOUNT_KEY_MAP[eventType];
        const am = getData(amtKey);
        am[amt] = (am[amt] || 0) + 1;
        setData(amtKey, am);

        onClose();
      }

      const types = [
        { id: 'buy-in-cash', label: 'Cash in' },
        { id: 'buy-in-iou', label: 'IOHost', sub: 'player owes host' },
        { id: 'cash-out-cash', label: 'Cash out' },
        { id: 'cash-out-iou', label: 'IOPlayer', sub: 'host owes player' }
      ];

      return html`
        <${Portal}>
          <div class="modal-backdrop">
            <div class="modal" onClick=${e => e.stopPropagation()}>
              <h3>Cash in / out</h3>
              <form onSubmit=${handleSubmit}>
                <div class="form-group">
                  <label>Player Name</label>
                  <input type="text" placeholder="Enter player name" required autocomplete="off"
                    value=${username} onInput=${e => setUsername(e.target.value)} />
                  <${AutocompleteChips} items=${topUsernames} onSelect=${v => setUsername(v)} />
                </div>
                <div class="form-group">
                  <label>Event Type</label>
                  <div class="type-selector">
                    ${types.map(t => html`
                      <button type="button" class="type-selector-btn ${eventType === t.id ? 'active' : ''}"
                        onClick=${() => setEventType(t.id)}>
                        ${t.label}${t.sub ? html`<br/><span style="font-size:0.6rem;opacity:0.7">${t.sub}</span>` : ''}
                      </button>
                    `)}
                  </div>
                </div>
                <div class="form-group">
                  <label>Amount ($)</label>
                  <input type="number" placeholder="Enter amount" min="0.01" step="0.01" required
                    value=${amount} onInput=${e => setAmount(e.target.value)} />
                  <${AutocompleteChips} items=${topAmounts} onSelect=${v => setAmount(v.replace('$', ''))} />
                </div>
                <div class="form-group">
                  <label>Notes <span style="font-size:0.65rem;color:var(--fg-dim);text-transform:none;letter-spacing:normal">(optional)</span></label>
                  <input type="text" placeholder="Optional notes" autocomplete="off"
                    value=${notes} onInput=${e => setNotes(e.target.value)} />
                </div>
                <div class="modal-actions">
                  <button type="button" class="modal-btn-cancel" onClick=${onClose}>Cancel</button>
                  <button type="submit" class="modal-btn-save">Add</button>
                </div>
              </form>
            </div>
          </div>
        </${Portal}>
      `;
    }

    function EditModal({ ev, events, setEvents, onClose }) {
      const [editType, setEditType] = useState(ev.type);
      const [editAmount, setEditAmount] = useState(ev.amount);
      const [editNotes, setEditNotes] = useState(ev.notes || '');

      const typeOptions = Object.entries(EVENT_TYPES).filter(([k]) => k !== 'edit');

      function saveEdit() {
        const amt = parseFloat(editAmount);
        if (isNaN(amt) || amt <= 0) return;

        const changes = [];
        if (ev.type !== editType) changes.push(EVENT_TYPES[ev.type] + ' → ' + EVENT_TYPES[editType]);
        if (ev.amount !== amt) changes.push(formatCurrency(ev.amount) + ' → ' + formatCurrency(amt));
        if ((ev.notes || '') !== editNotes) changes.push('notes: "' + (ev.notes || '') + '" → "' + editNotes + '"');

        if (changes.length > 0) {
          const editEvent = {
            id: Date.now(),
            username: ev.username,
            type: 'edit',
            amount: 0,
            changeDescription: changes.join('; '),
            timestamp: Date.now(),
            editedEventId: ev.id
          };

          const updated = events.map(e =>
            e.id === ev.id ? { ...e, type: editType, amount: amt, notes: editNotes } : e
          );
          updated.push(editEvent);
          setEvents(updated);
          setData(STORAGE_KEYS.EVENTS, updated);
        }
        onClose();
      }

      return html`
        <${Portal}>
          <div class="modal-backdrop">
            <div class="modal" onClick=${e => e.stopPropagation()}>
              <h3>Edit Event</h3>
              <div class="form-group">
                <label>Player</label>
                <input type="text" value=${ev.username} disabled style="opacity:0.6" />
              </div>
              <div class="form-group">
                <label>Event Type</label>
                <div class="type-selector">
                  ${typeOptions.map(([val, label]) => html`
                    <button type="button" class="type-selector-btn ${editType === val ? 'active' : ''}"
                      onClick=${() => setEditType(val)}>${label}</button>
                  `)}
                </div>
              </div>
              <div class="form-group">
                <label>Amount ($)</label>
                <input type="number" value=${editAmount} min="0.01" step="0.01"
                  onInput=${e => setEditAmount(e.target.value)} />
              </div>
              <div class="form-group">
                <label>Notes</label>
                <input type="text" value=${editNotes} placeholder="Optional notes"
                  onInput=${e => setEditNotes(e.target.value)} />
              </div>
              <div class="modal-actions">
                <button class="modal-btn-cancel" onClick=${onClose}>Cancel</button>
                <button class="modal-btn-save" onClick=${saveEdit}>Save</button>
              </div>
            </div>
          </div>
        </${Portal}>
      `;
    }

    function EventItem({ ev, edits, events, setEvents }) {
      const [showPopover, setShowPopover] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);

      function deleteEvent() {
        const changes = [];
        if (ev.amount !== 0) changes.push(formatCurrency(ev.amount) + ' → ' + formatCurrency(0));
        if ((ev.notes || '') !== 'Deleted') changes.push('notes: "' + (ev.notes || '') + '" → "Deleted"');

        const editEvent = {
          id: Date.now(),
          username: ev.username,
          type: 'edit',
          amount: 0,
          changeDescription: changes.join('; '),
          timestamp: Date.now(),
          editedEventId: ev.id
        };

        const updated = events.map(e =>
          e.id === ev.id ? { ...e, amount: 0, notes: 'Deleted' } : e
        );
        updated.push(editEvent);
        setEvents(updated);
        setData(STORAGE_KEYS.EVENTS, updated);
      }

      return html`
        <${Fragment}>
          <div class="event-item">
            <div class="event-main">
              <span class="event-player">${ev.username}</span>
              <span class="type-badge type-${ev.type}">${EVENT_TYPES[ev.type]}</span>
              <span class="event-amount">${formatCurrency(ev.amount)}</span>
              <button class="dots-btn" onClick=${() => setShowPopover(!showPopover)}>⋮</button>
            </div>
            <div class="event-meta">
              <span>${formatTime(ev.timestamp)}</span>
              ${ev.notes && html`<span class="event-notes">${ev.notes}</span>`}
            </div>
            ${showPopover && html`
              <div class="popover-backdrop" onClick=${() => setShowPopover(false)}></div>
              <div class="popover">
                <button class="popover-item" onClick=${() => { setShowPopover(false); setShowEditModal(true); }}>Edit</button>
                <button class="popover-item danger" onClick=${() => { setShowPopover(false); deleteEvent(); }}>Delete</button>
              </div>
            `}
          </div>
          ${edits.map(edit => html`
            <div class="event-edit-row">
              <span class="type-badge type-edit">Edit</span>
              <span class="event-edit-change">${edit.changeDescription || '-'}</span>
              <span>${formatTime(edit.timestamp)}</span>
            </div>
          `)}
          ${showEditModal && html`
            <${EditModal} ev=${ev} events=${events} setEvents=${setEvents}
              onClose=${() => setShowEditModal(false)} />
          `}
        </${Fragment}>
      `;
    }

    function EventListTab({ events, setEvents, onNewSession }) {
      const [showAddModal, setShowAddModal] = useState(false);

      function handleAddClick() {
        const mainEvents = events.filter(e => e.type !== 'edit');
        if (mainEvents.length > 0) {
          const lastEvent = mainEvents[mainEvents.length - 1];
          const hoursSince = (Date.now() - lastEvent.timestamp) / (1000 * 60 * 60);
          if (hoursSince >= 8) {
            if (confirm('It has been over 8 hours since the last event. Start a new session?')) {
              onNewSession();
              return;
            }
          }
        }
        setShowAddModal(true);
      }
      const mainEvents = useMemo(() => events.filter(e => e.type !== 'edit'), [events]);
      const editsByParent = useMemo(() => {
        const map = {};
        events.filter(e => e.type === 'edit').forEach(e => {
          if (!map[e.editedEventId]) map[e.editedEventId] = [];
          map[e.editedEventId].push(e);
        });
        return map;
      }, [events]);

      const uniquePlayers = useMemo(() => [...new Set(mainEvents.map(e => e.username))], [mainEvents]);


      return html`
        <button class="btn-primary" onClick=${handleAddClick}>+ Cash in / out</button>
        ${mainEvents.length === 0 ? html`
          <div class="empty-state">
            <div class="empty-state-icon">🎰</div>
            <p>No events recorded yet</p>
          </div>
        ` : html`
          <div class="summary-cards" style="margin-top:1rem;">
            <div class="summary-card">
              <div class="summary-card-label">Total Players</div>
              <div class="summary-card-value">${uniquePlayers.length}</div>
            </div>
            <div class="summary-card">
              <div class="summary-card-label">Total Events</div>
              <div class="summary-card-value">${mainEvents.length}</div>
            </div>
          </div>
          <div>
            ${mainEvents.map(ev => html`
              <${EventItem} key=${ev.id} ev=${ev}
                edits=${editsByParent[ev.id] || []}
                events=${events} setEvents=${setEvents} />
            `)}
          </div>
        `}
        ${showAddModal && html`
          <${AddEventModal} events=${events} setEvents=${setEvents}
            onClose=${() => setShowAddModal(false)} />
        `}
      `;
    }

    function ResultsTab({ events, sessionId }) {
      const summary = useMemo(() => {
        const s = {};
        events.forEach(ev => {
          if (ev.type === 'edit') return;
          if (!s[ev.username]) s[ev.username] = { buyInCash: 0, buyInIou: 0, cashOutCash: 0, cashOutIou: 0 };
          if (ev.type === 'buy-in-cash') s[ev.username].buyInCash += ev.amount;
          else if (ev.type === 'buy-in-iou') s[ev.username].buyInIou += ev.amount;
          else if (ev.type === 'cash-out-cash') s[ev.username].cashOutCash += ev.amount;
          else if (ev.type === 'cash-out-iou') s[ev.username].cashOutIou += ev.amount;
        });
        return s;
      }, [events]);

      const results = useMemo(() => {
        return Object.entries(summary).map(([player, s]) => {
          const totalBuyIn = s.buyInCash + s.buyInIou;
          const totalCashOut = s.cashOutCash + s.cashOutIou;
          const net = totalCashOut - totalBuyIn;
          return { player, totalBuyIn, totalCashOut, net, ...s };
        }).filter(r => r.totalBuyIn > 0 || r.totalCashOut > 0)
          .sort((a, b) => b.net - a.net);
      }, [summary]);

      const grandTotalCashOut = results.reduce((sum, r) => sum + r.totalCashOut, 0);
      const grandTotalBuyIn = results.reduce((sum, r) => sum + r.totalBuyIn, 0);
      const hostEarnings = grandTotalBuyIn - grandTotalCashOut;

      const winner = results.length > 0 && results[0].net > 0 ? results[0] : null;
      const loser = results.length > 0 && results[results.length - 1].net < 0 ? results[results.length - 1] : null;

      const iouData = useMemo(() => {
        return Object.entries(summary)
          .map(([player, s]) => ({
            player,
            owesHost: s.buyInIou,
            hostOwes: s.cashOutIou,
            netIou: s.buyInIou - s.cashOutIou
          }))
          .filter(d => d.owesHost > 0 || d.hostOwes > 0);
      }, [summary]);

      const discrepancyClass = hostEarnings > 0 ? 'positive' : (hostEarnings < 0 ? 'negative' : 'neutral');
      const discrepancyDisplay = hostEarnings >= 0 ? '+' + formatCurrency(hostEarnings) : formatCurrency(hostEarnings);
      const discrepancySubtitle = hostEarnings > 0 ? 'Host earns ' + formatCurrency(hostEarnings)
        : hostEarnings < 0 ? 'Host loses ' + formatCurrency(Math.abs(hostEarnings)) : '';

      if (results.length === 0) {
        return html`
          <div class="summary-cards">
            <div class="summary-card">
              <div class="summary-card-label">Total Cash Out</div>
              <div class="summary-card-value">$0</div>
            </div>
            <div class="summary-card">
              <div class="summary-card-label">Discrepancy</div>
              <div class="summary-card-value neutral">$0</div>
            </div>
          </div>
          <div class="empty-state">
            <div class="empty-state-icon">📊</div>
            <p>Add some events to see results</p>
          </div>
        `;
      }

      return html`
        <div class="summary-cards">
          <div class="summary-card">
            <div class="summary-card-label">Total Cash Out</div>
            <div class="summary-card-value">${formatCurrency(grandTotalCashOut)}</div>
          </div>
          <div class="summary-card">
            <div class="summary-card-label">Discrepancy</div>
            <div class="summary-card-value ${discrepancyClass}">${discrepancyDisplay}</div>
            ${discrepancySubtitle && html`<div class="summary-card-subtitle">${discrepancySubtitle}</div>`}
          </div>
          <div class="summary-card">
            <div class="summary-card-label">Biggest Winner</div>
            <div class="summary-card-value positive">${winner ? winner.player + ' (+' + formatCurrency(winner.net) + ')' : '-'}</div>
          </div>
          <div class="summary-card">
            <div class="summary-card-label">Biggest Loser</div>
            <div class="summary-card-value negative">${loser ? loser.player + ' (' + formatCurrency(loser.net) + ')' : '-'}</div>
          </div>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr><th>Player</th><th>Buy-In</th><th>Cash-Out</th><th>Net</th></tr>
            </thead>
            <tbody>
              ${results.map(r => {
                const netClass = r.net > 0 ? 'positive' : (r.net < 0 ? 'negative' : 'neutral');
                const netDisplay = r.net >= 0 ? '+' + formatCurrency(r.net) : formatCurrency(r.net);
                return html`
                  <tr>
                    <td>${r.player}</td>
                    <td>
                      ${formatCurrency(r.totalBuyIn)}
                      ${r.buyInIou > 0 && html`<span class="breakdown">${formatCurrency(r.buyInCash)} cash + ${formatCurrency(r.buyInIou)} IOU</span>`}
                    </td>
                    <td>
                      ${formatCurrency(r.totalCashOut)}
                      ${r.cashOutIou > 0 && html`<span class="breakdown">${formatCurrency(r.cashOutCash)} cash + ${formatCurrency(r.cashOutIou)} IOU</span>`}
                    </td>
                    <td class=${netClass}>${netDisplay}</td>
                  </tr>
                `;
              })}
            </tbody>
          </table>
        </div>
        ${iouData.length > 0 && html`
          <${IOUList} iouData=${iouData} sessionId=${sessionId} />
        `}
      `;
    }

    function IOUList({ iouData, sessionId }) {
      const [paidAmounts, setPaidAmounts] = useState(() => {
        const all = getData(STORAGE_KEYS.IOU_PAID);
        return all[sessionId] || {};
      });

      function updatePaid(player, value) {
        const val = parseFloat(value) || 0;
        const updated = { ...paidAmounts, [player]: val };
        setPaidAmounts(updated);
        const all = getData(STORAGE_KEYS.IOU_PAID);
        all[sessionId] = updated;
        setData(STORAGE_KEYS.IOU_PAID, all);
      }

      return html`
        <div style="margin-top:1.5rem;">
          <h3 style="color:var(--accent-light);font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;">Outstanding IOUs</h3>
          ${iouData.map(d => {
            const netClass = d.netIou > 0 ? 'negative' : (d.netIou < 0 ? 'positive' : 'neutral');
            const label = d.netIou > 0 ? d.player + ' owes host ' + formatCurrency(d.netIou)
              : d.netIou < 0 ? 'Host owes ' + d.player + ' ' + formatCurrency(Math.abs(d.netIou))
              : d.player + ' — Settled';
            const paid = paidAmounts[d.player] || '';
            const paidNum = parseFloat(paid) || 0;
            const isSettled = paidNum > 0 && paidNum >= Math.abs(d.netIou);
            return html`
              <div style="padding:0.6rem 0;border-bottom:1px solid var(--bg-highlight);display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                <span class=${netClass} style="flex:1;min-width:0;font-weight:normal;font-size:0.85rem;${isSettled ? 'opacity:0.4;' : ''}">${label}</span>
                <div style="display:flex;align-items:center;gap:0.3rem;">
                  <span style="font-size:0.7rem;color:var(--fg-dim);">Paid:</span>
                  <input type="number" class="edit-input" style="width:60px;" placeholder="0"
                    value=${paid} onInput=${e => updatePaid(d.player, e.target.value)} />
                </div>
              </div>
            `;
          })}
        </div>
      `;
    }

    function getSessionDisplayName(session) {
      const firstEvent = session.events.find(e => e.type !== 'edit');
      if (!firstEvent) return 'New session';
      const d = new Date(firstEvent.timestamp);
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function SessionsTab({ sessions, setSessions, activeSessionId, setActiveSessionId, setActiveTab }) {
      function createSession() {
        const newSession = { id: Date.now(), events: [] };
        const updated = [...sessions, newSession];
        setSessions(updated);
        setData(STORAGE_KEYS.SESSIONS, updated);
        setActiveSessionId(newSession.id);
        setData(STORAGE_KEYS.ACTIVE_SESSION, newSession.id);
        setActiveTab('list');
      }

      function openSession(id) {
        setActiveSessionId(id);
        setData(STORAGE_KEYS.ACTIVE_SESSION, id);
        setActiveTab('list');
      }

      function deleteSession(id) {
        if (sessions.length <= 1) return;
        if (!confirm('Delete this session and all its events?')) return;
        const updated = sessions.filter(s => s.id !== id);
        setSessions(updated);
        setData(STORAGE_KEYS.SESSIONS, updated);
        if (activeSessionId === id) {
          setActiveSessionId(updated[0].id);
          setData(STORAGE_KEYS.ACTIVE_SESSION, updated[0].id);
        }
      }

      return html`
        <button class="btn-primary" onClick=${createSession}>+ New Session</button>
        <div style="margin-top:1rem;">
          ${sessions.map(s => html`
            <${SessionItem} key=${s.id} session=${s} isActive=${s.id === activeSessionId}
              canDelete=${sessions.length > 1}
              onOpen=${() => openSession(s.id)}
              onDelete=${() => deleteSession(s.id)} />
          `)}
        </div>
      `;
    }

    function SessionItem({ session, isActive, canDelete, onOpen, onDelete }) {
      const [showPopover, setShowPopover] = useState(false);

      return html`
        <div style="padding:0.75rem;border-bottom:1px solid var(--bg-highlight);display:flex;align-items:center;gap:0.5rem;position:relative;">
          <span style="flex:1;">
            <span style="font-weight:${isActive ? '600' : '400'};color:${isActive ? 'var(--accent)' : 'var(--fg)'};">
              ${getSessionDisplayName(session)}
            </span>
            <span style="font-size:0.7rem;color:var(--fg-dim);margin-left:0.5rem;">${session.events.length} events</span>
            ${isActive && html`<span style="font-size:0.65rem;color:var(--accent);margin-left:0.5rem;">● active</span>`}
          </span>
          <button class="dots-btn" onClick=${() => setShowPopover(!showPopover)}>⋮</button>
          ${showPopover && html`
            <div class="popover-backdrop" onClick=${() => setShowPopover(false)}></div>
            <div class="popover">
              <button class="popover-item" onClick=${() => { setShowPopover(false); onOpen(); }}>Open</button>
              ${canDelete && html`
                <button class="popover-item danger" onClick=${() => { setShowPopover(false); onDelete(); }}>Delete</button>
              `}
            </div>
          `}
        </div>
      `;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('list');
      const [sessions, setSessions] = useState(() => getSessions());
      const [activeSessionId, setActiveSessionId] = useState(() => getActiveSessionId());

      const activeSession = sessions.find(s => s.id === activeSessionId) || sessions[0];
      const events = activeSession ? activeSession.events : [];

      function setEvents(newEvents) {
        const updated = sessions.map(s =>
          s.id === activeSessionId ? { ...s, events: newEvents } : s
        );
        setSessions(updated);
        setData(STORAGE_KEYS.SESSIONS, updated);
      }

      function createNewSession() {
        const newSession = { id: Date.now(), events: [] };
        const updated = [...sessions, newSession];
        setSessions(updated);
        setData(STORAGE_KEYS.SESSIONS, updated);
        setActiveSessionId(newSession.id);
        setData(STORAGE_KEYS.ACTIVE_SESSION, newSession.id);
      }

      return html`
        <a href="../index.html" class="back-link">
          <span>←</span>
          <span>Back to Apps</span>
        </a>
        <header>
          <h1>Poker Ledger</h1>
          <p class="subtitle">${activeSession ? getSessionDisplayName(activeSession) : ''}</p>
        </header>
        <${TabBar} activeTab=${activeTab} setActiveTab=${setActiveTab} />
        <div class="tab-content">
          ${activeTab === 'list' && html`<${EventListTab} events=${events} setEvents=${setEvents} onNewSession=${createNewSession} />`}
          ${activeTab === 'results' && html`<${ResultsTab} events=${events} sessionId=${activeSessionId} />`}
          ${activeTab === 'sessions' && html`<${SessionsTab} sessions=${sessions} setSessions=${setSessions}
            activeSessionId=${activeSessionId} setActiveSessionId=${setActiveSessionId}
            setActiveTab=${setActiveTab} />`}
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
